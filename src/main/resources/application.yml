# =============================================================================
# LAB-03 - Book Management API configuration.
#
# The catalogue lives in memory inside BookController, so the only thing the
# application needs is a port. Nothing here depends on a database.
# =============================================================================
spring:
  application:
    name: book-api

server:
  # Base URL of the lab: http://localhost:8080/api/v3/books
  port: 8080

logging:
  level:
    root: INFO
    edu.ku.bookapi: DEBUG
